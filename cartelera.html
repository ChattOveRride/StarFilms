/*sidebar dinámica*/

const movieData = {
  'mario': { title: 'The super Mario galaxy movie', img: 'https://www.youtube.com/embed/ipzEY7c7it8'},
  'minecraft': { title: 'A minecraft movie', img: 'https://www.youtube.com/embed/wJO_vIDZn-I'},
  'pixels': { title: 'Pixels', img: 'https://www.youtube.com/embed/XAHprLW48no'},
  'mib': { title: 'Men in black', img: 'https://www.youtube.com/embed/UxUTTrU6PA4'}
};

function updateSidebar(movieKey) {
  const data = movieData[movieKey];
  document.getElementById("sideTitle").innerText = data.title;
  document.getElementById("sideImg").src = data.img;
  document.getElementById("infodiv").innerHTML = "";
  document.getElementById("infotggbtn").innerHTML= "⌄";
}

function textshow() {
  var desc = 'Default';
    if (document.getElementById("sideTitle").innerText === "The super Mario galaxy movie"){
      desc = 'una descripcion de mario';
    }
    else if (document.getElementById("sideTitle").innerText === "A minecraft movie"){
      desc = 'una descripcion de Minecraft';
    }
    else if (document.getElementById("sideTitle").innerText === "Pixels"){
      desc = 'una descripcion de Pixeles';
    }
    else if (document.getElementById("sideTitle").innerText === "Men in black"){
      desc = 'una descripcion de Men in Black';
    }
  var x = document.getElementById("infodiv");
  if (x.innerHTML === "") {
    x.innerHTML = desc;
    document.getElementById("infotggbtn").innerHTML= "⌃";
    document.getElementById("infotggbtn").style.transform= "translate(0px, 20px)";
  } else {
    x.innerHTML = "";
     document.getElementById("infotggbtn").innerHTML= "⌄";
     document.getElementById("infotggbtn").style.transform= "translate(0px, 0px)";
  }
}

/* desplazamiento automático */

const carousel = document.getElementById("carouselList");
let isAutoScrolling = true;
let isLooping = false;

function autoScroll() {
  if (!isAutoScrolling) return;
  
  if (carousel.scrollLeft + carousel.offsetWidth >= carousel.scrollWidth - 10) {
    carousel.scrollTo({ left: 0, behavior: 'smooth' });
  } else {
    carousel.scrollBy({ left: carousel.offsetWidth, behavior: 'smooth' });
  }
}

let scrollInterval = setInterval(autoScroll, 3000);

function resetTimer() {
  clearInterval(scrollInterval);
  scrollInterval = setInterval(autoScroll, 3000);
}

carousel.addEventListener('mouseenter', () => isAutoScrolling = false);
carousel.addEventListener('mouseleave', () => isAutoScrolling = true);

carousel.addEventListener('scroll', () => {
  if (isLooping) return;
  resetTimer();
  if (carousel.scrollLeft + carousel.offsetWidth >= carousel.scrollWidth - 10) {
    isLooping = true;
    setTimeout(() => {
      carousel.scrollTo({ left: 0, behavior: 'smooth' });
      setTimeout(() => { isLooping = false; }, 600);
    }, 300);
  }
});

</script>
